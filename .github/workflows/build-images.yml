name: Build Sandbox Images

on:
  schedule:
    - cron: '0 3,15 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*/build/**'
      - '*/manifest.json'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/build-images.yml'
      - 'wrangler.toml'
  pull_request:
    paths:
      - '*/build/**'
      - '*/manifest.json'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/build-images.yml'
      - 'wrangler.toml'

permissions:
  contents: read

concurrency:
  group: sandbox-images-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'publish' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate Catalog and Test Version Updates
        run: |
          python3 scripts/build.py --validate
          python3 -m unittest discover -s tests -v
          python3 scripts/pack.py --output "$RUNNER_TEMP/catalog-check" --base-url https://sandbox-images.metorial.net --allow-unpublished
      - uses: docker/setup-buildx-action@v3
      - name: Install Registry Copier
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Smoke Test Pull Request Images
        if: github.event_name == 'pull_request' || github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        run: python3 scripts/build.py --prune-build-cache
      - name: Build, Smoke Test and Publish Changed Images
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          IMAGE_REGISTRY: ghcr.io/${{ github.repository }}
        run: python3 scripts/build.py --publish --prune-build-cache --registry "${IMAGE_REGISTRY,,}"
      - uses: actions/setup-node@v4
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          node-version: '24'
      - name: Pack Catalog and Retain Previous Releases
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: python3 scripts/pack.py --base-url https://sandbox-images.metorial.net --retain-releases
      - name: Deploy Genesis Catalog to Cloudflare Pages
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.149.0 pages deploy dist --project-name sandbox-images --branch main
      - name: Commit Updated Manifests
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -- '*/manifest.json'
          if git diff --cached --quiet; then
            echo 'All images are unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: update sandbox image versions'
          git push origin "HEAD:${DEFAULT_BRANCH}"
